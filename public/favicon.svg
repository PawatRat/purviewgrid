<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d25"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    
    <!-- Border Specular Highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Accent Tile Gradient (Indigo to Cyan) -->
    <linearGradient id="accentTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Pinned Tile Gradient (Amber to Orange) -->
    <linearGradient id="pinnedTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Frosted Glass Surface Gradient -->
    <linearGradient id="glassTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Squircle Canvas with Rim Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Fluid Masonry Composition -->
  <g transform="translate(96, 96)">
    <!-- Column 1: Tall Hero Accent Tile + Small Glass Tile -->
    <rect x="0" y="0" width="92" height="204" rx="18" fill="url(#accentTile)"/>
    <rect x="0" y="222" width="92" height="98" rx="18" fill="url(#glassTile)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

    <!-- Column 2: Pinned Amber Reference Tile + Medium Tile -->
    <rect x="110" y="0" width="96" height="124" rx="18" fill="url(#pinnedTile)"/>
    <rect x="110" y="142" width="96" height="178" rx="18" fill="url(#glassTile)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

    <!-- Column 3: Stacked Glass Tiles -->
    <rect x="224" y="0" width="92" height="92" rx="18" fill="url(#glassTile)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <rect x="224" y="110" width="92" height="210" rx="18" fill="url(#glassTile)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  </g>
</svg>